{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="formulario-centrado">
    <h1>Iniciar sesión</h1>
    <p>Entra con tu correo y tu contraseña.</p>
    <form class="formulario" action="{% url 'panel' %}" method="get">
        <label for="correo">Correo electrónico</label>
        <input id="correo" type="email" name="correo" placeholder="nombre@correo.com" required>

        <label for="clave">Contraseña</label>
        <input id="clave" type="password" name="clave" required>

        <button class="boton" type="submit">Entrar</button>
    </form>
    <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Crea una aquí</a>.</p>
</section>
{% endblock %}
